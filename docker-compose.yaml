services:
  db:
    image: manatees-postgres:16-pg-ttl
    build:
      context: ./services/db
      dockerfile: Dockerfile
    container_name: manatees-db
    command: ['postgres', '-c', 'shared_preload_libraries=pg_ttl_index']
    environment:
      POSTGRES_USER: fallon
      POSTGRES_PASSWORD: ${PGPASSWORD}
      APP_DB: manatees
      APP_SCHEMA: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
